<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shoe Order Book</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;color:#222;max-width:480px;margin:0 auto;min-height:100vh}
header{background:#1a1a1a;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:1.3rem;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tab{flex:1;padding:14px;text-align:center;font-weight:500;color:#666;cursor:pointer}
.tab.active{color:#e67e22;border-bottom:3px solid #e67e22}
.container{padding:16px;padding-bottom:90px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card h3{font-size:1.05rem;margin-bottom:4px}
.card p{font-size:0.9rem;color:#555;margin:2px 0}
.status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;margin-top:6px}
.status.Pending{background:#fff3cd;color:#856404}
.status.Paid{background:#d4edda;color:#155724}
.status.Delivered{background:#cce5ff;color:#004085}
.status.Cancelled{background:#f8d7da;color:#721c24}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px}
.btn-primary{background:#e67e22;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-secondary{background:#eee;color:#333}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:0.85rem;color:#555;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;background:#fff}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#e67e22;color:#fff;font-size:28px;border:none;box-shadow:0 4px 12px rgba(230,126,34,0.4);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:60px 20px;color:#999}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:14px;font-size:1rem}
.hidden{display:none}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>Shoe Order Book</h1>
</header>

<div class="tabs">
<div class="tab active" onclick="showTab('list')">Orders</div>
<div class="tab" onclick="showTab('add')">Add Order</div>
</div>

<div id="listView" class="container">
<input type="text" class="search" id="searchInput" placeholder="Search name or phone..." oninput="renderList()">
<div id="orderList"></div>
</div>

<div id="addView" class="container hidden">
<div class="form-group">
<label>Customer Name</label>
<input type="text" id="name">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone">
</div>
<div class="form-group">
<label>Shoe Style</label>
<input type="text" id="style" placeholder="e.g. Leather Oxford, Sneakers">
</div>
<div class="form-group">
<label>Size</label>
<input type="text" id="size" placeholder="e.g. 42, 43">
</div>
<div class="form-group">
<label>Deposit (₦)</label>
<input type="number" id="deposit" min="0">
</div>
<div class="form-group">
<label>Balance (₦)</label>
<input type="number" id="balance" min="0">
</div>
<div class="form-group">
<label>Status</label>
<select id="status">
<option>Pending</option>
<option>Paid</option>
<option>Delivered</option>
<option>Cancelled</option>
</select>
</div>
<button class="btn btn-primary" onclick="saveOrder()">Save Order</button>
<button class="btn btn-secondary" onclick="showTab('list')">Cancel</button>
</div>

<div id="detailView" class="container hidden">
<div class="card" id="detailCard"></div>
<div class="actions">
<button class="btn-primary" style="background:#e67e22;color:#fff" onclick="editCurrent()">Edit</button>
<button class="btn-danger" onclick="deleteCurrent()">Delete</button>
</div>
<button class="btn btn-secondary" onclick="showTab('list')">Back</button>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('shoeOrders') || '[]');
let currentId = null;

function saveToStorage() {
localStorage.setItem('shoeOrders', JSON.stringify(orders));
}

function showTab(tab) {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.getElementById('listView').classList.add('hidden');
document.getElementById('addView').classList.add('hidden');
document.getElementById('detailView').classList.add('hidden');

if (tab === 'list') {
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('listView').classList.remove('hidden');
renderList();
} else if (tab === 'add') {
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('addView').classList.remove('hidden');
clearForm();
currentId = null;
}
}

function clearForm() {
document.getElementById('name').value = '';
document.getElementById('phone').value = '';
document.getElementById('style').value = '';
document.getElementById('size').value = '';
document.getElementById('deposit').value = '';
document.getElementById('balance').value = '';
document.getElementById('status').value = 'Pending';
}

function saveOrder() {
const name = document.getElementById('name').value.trim();
const phone = document.getElementById('phone').value.trim();
const style = document.getElementById('style').value.trim();
const size = document.getElementById('size').value.trim();
const deposit = Number(document.getElementById('deposit').value) || 0;
const balance = Number(document.getElementById('balance').value) || 0;
const status = document.getElementById('status').value;

if (!name || !phone) {
alert('Name and phone are required');
return;
}

if (currentId) {
const idx = orders.findIndex(o => o.id === currentId);
if (idx > -1) {
orders[idx] = { ...orders[idx], name, phone, style, size, deposit, balance, status };
}
} else {
orders.unshift({
id: Date.now().toString(),
name, phone, style, size, deposit, balance, status,
date: new Date().toLocaleDateString('en-NG')
});
}

saveToStorage();
showTab('list');
}

function renderList() {
const q = document.getElementById('searchInput').value.toLowerCase();
const list = document.getElementById('orderList');
const filtered = orders.filter(o => 
o.name.toLowerCase().includes(q) || o.phone.includes(q)
);

if (filtered.length === 0) {
list.innerHTML = '<div class="empty">No orders yet.<br>Tap Add Order to start.</div>';
return;
}

list.innerHTML = filtered.map(o => `
<div class="card" onclick="showDetail('${o.id}')">
<h3>${o.name}</h3>
<p>${o.phone}</p>
<p>${o.style || '-'} • Size ${o.size || '-'}</p>
<p>Deposit: ₦\( {o.deposit.toLocaleString()} | Balance: ₦ \){o.balance.toLocaleString()}</p>
<span class="status \( {o.status}"> \){o.status}</span>
</div>
`).join('');
}

function showDetail(id) {
currentId = id;
const o = orders.find(x => x.id === id);
if (!o) return;

document.getElementById('listView').classList.add('hidden');
document.getElementById('addView').classList.add('hidden');
document.getElementById('detailView').classList.remove('hidden');

document.getElementById('detailCard').innerHTML = `
<h3>${o.name}</h3>
<p><strong>Phone:</strong> ${o.phone}</p>
<p><strong>Style:</strong> ${o.style || '-'}</p>
<p><strong>Size:</strong> ${o.size || '-'}</p>
<p><strong>Deposit:</strong> ₦${o.deposit.toLocaleString()}</p>
<p><strong>Balance:</strong> ₦${o.balance.toLocaleString()}</p>
<p><strong>Date:</strong> ${o.date}</p>
<span class="status \( {o.status}"> \){o.status}</span>
`;
}

function editCurrent() {
const o = orders.find(x => x.id === currentId);
if (!o) return;

document.getElementById('name').value = o.name;
document.getElementById('phone').value = o.phone;
document.getElementById('style').value = o.style || '';
document.getElementById('size').value = o.size || '';
document.getElementById('deposit').value = o.deposit;
document.getElementById('balance').value = o.balance;
document.getElementById('status').value = o.status;

document.getElementById('detailView').classList.add('hidden');
document.getElementById('addView').classList.remove('hidden');
document.querySelectorAll('.tab')[1].classList.add('active');
document.querySelectorAll('.tab')[0].classList.remove('active');
}

function deleteCurrent() {
if (!confirm('Delete this order?')) return;
orders = orders.filter(o => o.id !== currentId);
saveToStorage();
showTab('list');
}

renderList();
</script>
</body>
</html>
