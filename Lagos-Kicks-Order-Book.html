<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Kicks – Customer Order Book</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --green: #25D366;
    --green-dark: #1da851;
    --text: #e7e9ea;
    --muted: #8b98a5;
    --border: #2f3336;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  header {
    background: var(--card);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .badge { background: var(--green); color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .order-card { display: flex; flex-direction: column; gap: 6px; }
  .order-card .name { font-weight: 600; font-size: 1.05rem; }
  .order-card .meta { font-size: 0.85rem; color: var(--muted); }
  .status {
    display: inline-block;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status.pending { background: #f59e0b33; color: #fbbf24; }
  .status.paid { background: #25D36633; color: var(--green); }
  .status.delivered { background: #3b82f633; color: #60a5fa; }
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--green);
    color: #000;
    border: none;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    cursor: pointer;
    z-index: 20;
  }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { margin-bottom: 20px; font-size: 1.25rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  textarea { resize: vertical; min-height: 70px; }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  button.primary {
    flex: 1;
    background: var(--green);
    color: #000;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button.secondary {
    flex: 1;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .wa-preview {
    background: #075e54;
    border-radius: 12px;
    padding: 14px;
    margin: 16px 0;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 16px;
    font-size: 1rem;
  }
</style>
</head>
<body>
<header>
  <h1>Lagos Kicks Order Book</h1>
  <span class="badge">WhatsApp Ready</span>
</header>

<div class="container">
  <input type="text" class="search" id="search" placeholder="Search customer or shoe..." oninput="renderOrders()">
  <div id="orders"></div>
  <div class="empty" id="empty" style="display:none;">
    No orders yet.<br>Tap + to add your first customer.
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Add / Edit Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">New Customer Order</h2>
    <input type="hidden" id="editId">
    <label>Customer Name</label>
    <input type="text" id="name" placeholder="e.g. Chinedu Okoro">
    <label>WhatsApp Number</label>
    <input type="tel" id="phone" placeholder="e.g. 0803 123 4567">
    <label>Shoe Style</label>
    <select id="shoe">
      <option>Nike Air Force 1</option>
      <option>Adidas Samba</option>
      <option>Jordan 1 Retro</option>
      <option>New Balance 550</option>
      <option>Local Leather Slippers</option>
      <option>Custom Design</option>
      <option>Other</option>
    </select>
    <label>Size</label>
    <input type="text" id="size" placeholder="e.g. 43 / 9US">
    <label>Quantity</label>
    <input type="number" id="qty" value="1" min="1">
    <label>Price (₦)</label>
    <input type="number" id="price" placeholder="45000">
    <label>Notes (optional)</label>
    <textarea id="notes" placeholder="Color, delivery address, etc."></textarea>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveOrder()">Save Order</button>
    </div>
  </div>
</div>

<!-- WhatsApp Confirm Modal -->
<div class="modal" id="waModal">
  <div class="modal-content">
    <h2>Send WhatsApp Message</h2>
    <div class="wa-preview" id="waText"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeWaModal()">Close</button>
      <button class="primary" id="sendWaBtn">Open WhatsApp & Send</button>
    </div>
  </div>
</div>

<script>
  let orders = JSON.parse(localStorage.getItem('lagosKicksOrders') || '[]');

  function saveToStorage() {
    localStorage.setItem('lagosKicksOrders', JSON.stringify(orders));
  }

  function renderOrders() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = orders.filter(o => 
      o.name.toLowerCase().includes(q) || 
      o.shoe.toLowerCase().includes(q) ||
      o.phone.includes(q)
    );
    const container = document.getElementById('orders');
    const empty = document.getElementById('empty');
    
    if (filtered.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    
    container.innerHTML = filtered.map(o => `
      <div class="card order-card" onclick="openWa('${o.id}')">
        <div class="name">${o.name}</div>
        <div class="meta">${o.phone} • ${o.shoe} • Size ${o.size} × ${o.qty}</div>
        <div class="meta">₦${Number(o.price).toLocaleString()} • ${o.notes || 'No notes'}</div>
        <div><span class="status \( {o.status}"> \){o.status}</span></div>
      </div>
    `).join('');
  }

  function openModal(id = null) {
    document.getElementById('modal').classList.add('active');
    if (id) {
      const o = orders.find(x => x.id === id);
      document.getElementById('modalTitle').textContent = 'Edit Order';
      document.getElementById('editId').value = id;
      document.getElementById('name').value = o.name;
      document.getElementById('phone').value = o.phone;
      document.getElementById('shoe').value = o.shoe;
      document.getElementById('size').value = o.size;
      document.getElementById('qty').value = o.qty;
      document.getElementById('price').value = o.price;
      document.getElementById('notes').value = o.notes || '';
    } else {
      document.getElementById('modalTitle').textContent = 'New Customer Order';
      document.getElementById('editId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('shoe').value = 'Nike Air Force 1';
      document.getElementById('size').value = '';
      document.getElementById('qty').value = 1;
      document.getElementById('price').value = '';
      document.getElementById('notes').value = '';
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function saveOrder() {
    const id = document.getElementById('editId').value || Date.now().toString();
    const order = {
      id,
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim().replace(/\s/g,''),
      shoe: document.getElementById('shoe').value,
      size: document.getElementById('size').value.trim(),
      qty: document.getElementById('qty').value,
      price: document.getElementById('price').value,
      notes: document.getElementById('notes').value.trim(),
      status: 'pending',
      created: new Date().toISOString()
    };
    if (!order.name || !order.phone) {
      alert('Name and WhatsApp number are required');
      return;
    }
    const idx = orders.findIndex(o => o.id === id);
    if (idx > -1) orders[idx] = order;
    else orders.unshift(order);
    saveToStorage();
    closeModal();
    renderOrders();
    // Auto open WhatsApp after save
    setTimeout(() => openWa(id), 300);
  }

  function openWa(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const msg = `Hello ${o.name},\n\nYour order from *Lagos Kicks* is confirmed:\n• ${o.qty}x ${o.shoe} (Size \( {o.size})\n• Total: ₦ \){Number(o.price).toLocaleString()}\n${o.notes ? '• Notes: ' + o.notes + '\n' : ''}\nThank you! We will update you on readiness for pickup/delivery.\n\n– Lagos Kicks`;
    document.getElementById('waText').innerText = msg;
    document.getElementById('waModal').classList.add('active');
    
    // Clean phone for wa.me
    let phone = o.phone.replace(/\D/g,'');
    if (phone.startsWith('0')) phone = '234' + phone.slice(1);
    if (!phone.startsWith('234')) phone = '234' + phone;
    
    document.getElementById('sendWaBtn').onclick = () => {
      window.open(`https://wa.me/\( {phone}?text= \){encodeURIComponent(msg)}`, '_blank');
      // Mark as paid/sent
      o.status = 'paid';
      saveToStorage();
      renderOrders();
      closeWaModal();
    };
  }

  function closeWaModal() {
    document.getElementById('waModal').classList.remove('active');
  }

  // Init
  renderOrders();
</script>
</body>
</html>
