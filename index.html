<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOMBA AI — Flyer Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #ffd43b;
    color: #000;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
}

header p {
    margin: 6px 0 0;
    font-size: 13px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 22px 15px 40px;
}

.generator {
    max-width: 600px;
    margin: auto;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    background: #111;
    color: white;
    font-size: 16px;
    outline: none;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #ffd43b;
}

.generate {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #ffd43b;
    color: #000;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
}

.generate:hover {
    opacity: .9;
}

.result-title {
    text-align: center;
    margin: 35px 0 15px;
    color: #ffd43b;
}

/* =========================
   REAL SQUARE FLYER
   ========================= */

.flyer-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
}

.flyer {
    width: min(100%, 700px);
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
    padding: 7%;
    background:
        radial-gradient(
            circle at 85% 12%,
            rgba(255,212,59,.35),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #050505 0%,
            #171717 50%,
            #000 100%
        );
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* Decorative circles */

.flyer::before {
    content: "";
    position: absolute;
    width: 48%;
    aspect-ratio: 1;
    border-radius: 50%;
    right: -20%;
    top: -15%;
    background: rgba(255,212,59,.12);
}

.flyer::after {
    content: "";
    position: absolute;
    width: 40%;
    aspect-ratio: 1;
    border-radius: 50%;
    left: -20%;
    bottom: -18%;
    background: rgba(255,255,255,.05);
}

.decor-line {
    position: absolute;
    width: 80%;
    height: 3px;
    background: #ffd43b;
    right: -20%;
    top: 37%;
    transform: rotate(-12deg);
    opacity: .7;
}

.flyer-content {
    position: relative;
    z-index: 5;
}

.brand {
    color: #ffd43b;
    font-size: clamp(20px, 4vw, 38px);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.badge {
    display: inline-block;
    margin-top: 6%;
    padding: 7px 14px;
    border-radius: 30px;
    background: #ffd43b;
    color: #000;
    font-size: clamp(10px, 2vw, 16px);
    font-weight: 900;
    text-transform: uppercase;
}

.flyer h2 {
    max-width: 80%;
    margin: 5% 0 0;
    font-size: clamp(36px, 7vw, 75px);
    line-height: .92;
    letter-spacing: -2px;
    text-transform: uppercase;
}

.subtitle {
    max-width: 70%;
    margin-top: 4%;
    font-size: clamp(13px, 2.5vw, 24px);
    line-height: 1.3;
    color: #eee;
}

/* Product visual */

.product-glow {
    position: absolute;
    z-index: 2;
    right: 4%;
    top: 36%;
    width: 47%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,212,59,.35),
        transparent 65%
    );
}

.product {
    position: absolute;
    z-index: 6;
    right: 7%;
    top: 40%;
    width: 40%;
    text-align: center;
    transform: rotate(-10deg);
    filter: drop-shadow(0 18px 14px rgba(0,0,0,.7));
}

.product-icon {
    font-size: clamp(75px, 16vw, 170px);
    line-height: 1;
}

/* Price */

.price-area {
    position: relative;
    z-index: 8;
    margin-top: 5%;
}

.price-label {
    color: #ddd;
    font-size: clamp(10px, 2vw, 16px);
    text-transform: uppercase;
    font-weight: bold;
}

.price {
    color: #ffd43b;
    font-size: clamp(32px, 6vw, 65px);
    font-weight: 950;
    line-height: 1;
    margin-top: 4px;
}

/* Bottom */

.flyer-bottom {
    position: relative;
    z-index: 10;
    border-top: 2px solid rgba(255,255,255,.2);
    padding-top: 4%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.contact {
    font-size: clamp(10px, 2vw, 17px);
    line-height: 1.4;
}

.contact strong {
    color: #ffd43b;
}

.shop {
    background: #ffd43b;
    color: #000;
    padding: 10px 16px;
    border-radius: 30px;
    font-size: clamp(10px, 2vw, 17px);
    font-weight: 900;
    white-space: nowrap;
}

/* Download button */

.download {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 18px auto 0;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: white;
    color: #000;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
}

.footer {
    text-align: center;
    color: #777;
    padding: 25px;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .flyer {
        width: 100%;
    }

    .flyer h2 {
        max-width: 75%;
    }

    .subtitle {
        max-width: 65%;
    }

    .flyer-bottom {
        align-items: flex-end;
    }

    .shop {
        padding: 8px 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 BOMBA AI</h1>
    <p>Professional Square Flyer Generator</p>
</header>

<div class="container">

    <div class="generator">

        <label for="businessName">
            Business Name
        </label>

        <input
            id="businessName"
            type="text"
            value="Kingsley Shoes"
            placeholder="Enter business name"
        >

        <label for="headline">
            Main Headline
        </label>

        <input
            id="headline"
            type="text"
            value="STEP UP YOUR GAME"
            placeholder="Enter flyer headline"
        >

        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            placeholder="Describe your product or service"
        >Premium stylish sneakers designed to elevate your everyday look.</textarea>

        <label for="price">
            Price
        </label>

        <input
            id="price"
            type="text"
            value="₦25,000"
            placeholder="Enter price"
        >

        <label for="phone">
            WhatsApp / Phone
        </label>

        <input
            id="phone"
            type="text"
            value="08000000000"
            placeholder="Enter phone number"
        >

        <button
            class="generate"
            onclick="generateFlyer()"
        >
            ✨ CREATE SQUARE FLYER
        </button>

    </div>

    <h2 class="result-title">
        Your Flyer
    </h2>

    <div class="flyer-wrapper">

        <div class="flyer" id="flyer">

            <div class="decor-line"></div>

            <div class="flyer-content">

                <div
                    class="brand"
                    id="flyerBrand"
                >
                    KINGSLEY SHOES
                </div>

                <div class="badge">
                    NEW COLLECTION
                </div>

                <h2 id="flyerHeadline">
                    STEP UP<br>YOUR GAME
                </h2>

                <div
                    class="subtitle"
                    id="flyerDescription"
                >
                    Premium stylish sneakers designed
                    to elevate your everyday look.
                </div>

                <div class="price-area">

                    <div class="price-label">
                        Starting From
                    </div>

                    <div
                        class="price"
                        id="flyerPrice"
                    >
                        ₦25,000
                    </div>

                </div>

            </div>

            <div class="product-glow"></div>

            <div class="product">
                <div class="product-icon">
                    👟
                </div>
            </div>

            <div class="flyer-bottom">

                <div class="contact">
                    <strong>ORDER NOW</strong><br>
                    WhatsApp:
                    <span id="flyerPhone">
                        08000000000
                    </span>
                </div>

                <div class="shop">
                    SHOP NOW
                </div>

            </div>

        </div>

    </div>

    <button
        class="download"
        onclick="downloadFlyer()"
    >
        📥 SAVE FLYER
    </button>

</div>

<div class="footer">
    © 2026 BOMBA AI — Automate. Grow. Earn.
</div>

<script>

function generateFlyer() {

    const business =
        document.getElementById("businessName").value
        || "YOUR BUSINESS";

    const headline =
        document.getElementById("headline").value
        || "YOUR HEADLINE";

    const description =
        document.getElementById("description").value
        || "Your product or service description.";

    const price =
        document.getElementById("price").value
        || "₦0";

    const phone =
        document.getElementById("phone").value
        || "08000000000";

    document.getElementById("flyerBrand").innerText =
        business.toUpperCase();

    const words = headline.trim().split(" ");

    if (words.length > 2) {

        const midpoint =
            Math.ceil(words.length / 2);

        document.getElementById("flyerHeadline").innerHTML =
            words.slice(0, midpoint).join(" ")
            + "<br>"
            + words.slice(midpoint).join(" ");

    } else {

        document.getElementById("flyerHeadline").innerText =
            headline.toUpperCase();

    }

    document.getElementById("flyerDescription").innerText =
        description;

    document.getElementById("flyerPrice").innerText =
        price;

    document.getElementById("flyerPhone").innerText =
        phone;
}


/*
    Save the flyer as an image.

    The browser's print/save option is used so
    the square flyer can be saved cleanly.
*/

function downloadFlyer() {

    const flyer =
        document.getElementById("flyer");

    const popup =
        window.open("", "_blank");

    popup.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>BOMBA AI Flyer</title>

            <style>
                body {
                    margin: 0;
                    background: #000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                }

                .flyer {
                    width: 1080px;
                    height: 1080px;
                    position: relative;
                    overflow: hidden;
                    padding: 76px;
                    background:
                        radial-gradient(
                            circle at 85% 12%,
                            rgba(255,212,59,.35),
                            transparent 28%
                        ),
                        linear-gradient(
                            135deg,
                            #050505,
                            #171717 50%,
                            #000
                        );
                    color: white;
                    font-family: Arial, sans-serif;
                }

                .brand {
                    color: #ffd43b;
                    font-size: 42px;
                    font-weight: 900;
                    letter-spacing: 2px;
                }

                .badge {
                    display: inline-block;
                    margin-top: 55px;
                    padding: 10px 20px;
                    border-radius: 30px;
                    background: #ffd43b;
                    color: #000;
                    font-size: 18px;
                    font-weight: 900;
                }

                h2 {
                    max-width: 800px;
                    margin: 40px 0 0;
                    font-size: 88px;
                    line-height: .92;
                    font-weight: 950;
                    text-transform: uppercase;
                }

                .subtitle {
                    max-width: 620px;
                    margin-top: 35px;
                    font-size: 27px;
                    line-height: 1.3;
                    color: #eee;
                }

                .price-area {
                    margin-top: 45px;
                }

                .price-label {
                    color: #ddd;
                    font-size: 20px;
                    text-transform: uppercase;
                    font-weight: bold;
                }

                .price {
                    color: #ffd43b;
                    font-size: 76px;
                    font-weight: 950;
                }

                .product {
                    position: absolute;
                    right: 70px;
                    top: 430px;
                    font-size: 180px;
                    transform: rotate(-10deg);
                }

                .bottom {
                    position: absolute;
                    left: 76px;
                    right: 76px;
                    bottom: 76px;
                    padding-top: 35px;
                    border-top: 2px solid rgba(255,255,255,.2);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-size: 21px;
                }

                .order {
                    color: #ffd43b;
                    font-weight: bold;
                }

                .shop {
                    background: #ffd43b;
                    color: #000;
                    padding: 14px 25px;
                    border-radius: 30px;
                    font-weight: 900;
                }
            </style>
        </head>

        <body>

            <div class="flyer">

                <div class="brand">
                    ${escapeHTML(
                        document.getElementById("flyerBrand").innerText
                    )}
                </div>

                <div class="badge">
                    NEW COLLECTION
                </div>

                <h2>
                    ${document.getElementById("flyerHeadline").innerHTML}
                </h2>

                <div class="subtitle">
                    ${escapeHTML(
                        document.getElementById("flyerDescription").innerText
                    )}
                </div>

                <div class="price-area">
                    <div class="price-label">
                        Starting From
                    </div>

                    <div class="price">
                        ${escapeHTML(
                            document.getElementById("flyerPrice").innerText
                        )}
                    </div>
                </div>

                <div class="product">
                    👟
                </div>

                <div class="bottom">

                    <div>
                        <span class="order">
                            ORDER NOW
                        </span>
                        <br>
                        WhatsApp:
                        ${escapeHTML(
                            document.getElementById("flyerPhone").innerText
                        )}
                    </div>

                    <div class="shop">
                        SHOP NOW
                    </div>

                </div>

            </div>

            <script>
                window.onload = function() {
                    setTimeout(function() {
                        window.print();
                    }, 500);
                };
            <\/script>

        </body>
        </html>
    `);

    popup.document.close();
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
