<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gold and Black App</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #000;
        color: #ffd700;
        margin: 0;
        min-height: 100vh;
    }

    header {
        background-color: #ffd700;
        color: #000;
        padding: 22px 15px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 25px;
    }

    .container {
        padding: 25px 18px;
        max-width: 700px;
        margin: auto;
    }

    .container h2 {
        margin-top: 0;
    }

    .feature-buttons {
        display: grid;
        gap: 12px;
        margin-top: 20px;
    }

    button {
        width: 100%;
        background-color: #ffd700;
        color: #000;
        border: none;
        border-radius: 8px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    #feature-description {
        margin-top: 25px;
        padding: 18px;
        border: 1px solid #ffd700;
        border-radius: 8px;
        min-height: 60px;
        line-height: 1.5;
    }

    .footer {
        text-align: center;
        padding: 20px;
        margin-top: 30px;
        border-top: 1px solid #333;
    }

    .footer p {
        margin: 0;
        font-size: 14px;
    }
</style>

</head><body><header>
    <h1>Welcome to the Gold and Black App</h1>
</header>

<div class="container">

    <h2>Features</h2>

    <p>
        Explore our amazing features designed for you!
    </p>

    <div class="feature-buttons">

        <button onclick="showFeature('Feature 1')">
            Feature 1
        </button>

        <button onclick="showFeature('Feature 2')">
            Feature 2
        </button>

        <button onclick="showFeature('Feature 3')">
            Feature 3
        </button>

    </div>

    <div id="feature-description">
        Select a feature above to see more information.
    </div>

</div>

<div class="footer">
    <p>&copy; 2026 Gold and Black App</p>
</div>

<script>

    function showFeature(feature) {

        const description = {

            'Feature 1':
                'Description of Feature 1: Lorem ipsum dolor sit amet.',

            'Feature 2':
                'Description of Feature 2: Consectetur adipiscing elit.',

            'Feature 3':
                'Description of Feature 3: Sed do eiusmod tempor incididunt.'

        };

        document.getElementById('feature-description').innerText =
            description[feature];

    }

</script>

</body>
</html>
